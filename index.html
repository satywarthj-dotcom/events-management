<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Management</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; text-align: center; }
        header { background: #333; color: white; padding: 20px; }
        .container { padding: 40px 20px; }
        .event-card { background: white; margin: 20px auto; padding: 20px; max-width: 400px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn { background: #28a745; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; display: inline-block; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to Events Management</h1>
        <p>हमारे आगामी इवेंट्स और बुकिंग्स की जानकारी</p>
    </header>

    <div class="container">
        <h2>Upcoming Events</h2>
        
        <div class="event-card">
            <h3>Grand Music & Cultural Night</h3>
            <p>दिनांक: 15 अक्टूबर 2026</p>
            <p>स्थान: मुख्य ऑडिटोरियम</p>
            <a href="#" class="btn">Book Now</a>
        </div>
    </div>

</body>
</html>
